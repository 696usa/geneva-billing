<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geneva Billing</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--navy:#1b2a41;--gold:#b8963e;--paper:#f7f5ef;--line:#d9d4c7;--muted:#6b7280;--text:#1f2937;--green:#2f6b4f;--red:#a23b2a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;font-size:15px;color:var(--text);background:var(--paper)}
header{background:var(--navy);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header b{font-family:Georgia,serif;font-size:19px}header small{display:block;color:var(--gold);font-size:12px}
nav{display:flex;background:var(--navy);padding:0 6px 8px;gap:4px;flex-wrap:wrap}
nav button{background:transparent;color:#d7dce6;border:0;padding:8px 12px;border-radius:6px;font:inherit}
nav button.on{background:rgba(255,255,255,.14);color:#fff}
main{padding:14px;max-width:900px;margin:0 auto}
h2{font-family:Georgia,serif;margin:0 0 10px;font-size:22px}h3{font-family:Georgia,serif;margin:20px 0 8px;font-size:17px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}th{color:var(--muted);font-weight:500;font-size:12px;background:#fbfaf7}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}tfoot td{font-weight:600;background:#fbfaf7}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:5px;background:#fff;width:100%}
input.n{text-align:right}label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.f{margin-bottom:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;padding:9px 14px;border-radius:5px;border:1px solid var(--navy);background:var(--navy);color:#fff}
.btn.g{background:transparent;color:var(--navy)}.btn.d{background:transparent;color:var(--red);border-color:var(--red)}.btn.s{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5}.link{background:none;border:0;color:var(--navy);text-decoration:underline;font:inherit;padding:0}
.panel{background:#fff;border:1px solid var(--line);padding:14px;margin-bottom:14px}
.note{border-left:3px solid var(--gold);background:#f3ead3;padding:8px 12px;margin-bottom:12px;font-size:14px}
.err{border-left:3px solid var(--red);background:#f8e9e6;color:var(--red);padding:8px 12px;margin-bottom:12px;font-size:14px}
.ok{border-left:3px solid var(--green);background:#e8f1ec;color:var(--green);padding:8px 12px;margin-bottom:12px;font-size:14px}
.empty{padding:30px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--muted)}
.pill.final{border-color:var(--green);color:var(--green)}.pill.void{border-color:var(--red);color:var(--red)}.pill.x{border-color:var(--red);color:var(--red)}
.click{cursor:pointer}.click:active{background:#fcfbf8}
.stmt{background:#fff;border:1px solid var(--line);border-top:4px solid var(--gold);padding:20px 16px}
.stmt .firm{font-family:Georgia,serif;font-size:18px}.stmt .firm small{display:block;font-family:system-ui;font-size:12px;color:var(--muted)}
.stmt .meta{color:var(--muted);font-size:13px;margin-top:8px;line-height:1.6}
.amt{font-family:Georgia,serif;font-size:40px;line-height:1;margin:20px 0 4px;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:13px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.muted{color:var(--muted);font-size:13px}.wrap{overflow-x:auto}
@media print{header,nav,.acts,.link{display:none!important}body{background:#fff}main{padding:0;max-width:none}.stmt{border:0;padding:0}}
.gate{min-height:100vh;display:grid;place-items:center;background:var(--navy);padding:20px}
.gate .card{background:#fff;padding:28px;width:100%;max-width:380px;border-top:4px solid var(--gold)}
.gate h2{margin-bottom:14px}.gate .muted{margin:8px 0 14px}
.busy{position:fixed;top:0;left:0;right:0;height:3px;background:var(--gold);display:none}
</style>
</head>

<nav id="nav" style="display:none"></nav>
<div id="errbar" class="err" style="display:none;margin:10px 14px 0"></div>
<main id="app"></main>

async function addAcct(c){const number=document.getElementById('an').value.trim();if(!number)return;if(D.accounts.some(a=>normNum(a.number)===normNum(number)))return alert('That account number already exists.');const a={id:uid(),client:c,custodian:document.getElementById('ac').value,number,nickname:document.getElementById('ak').value.trim(),active:true};await db('accounts',sb.from('accounts').insert({id:a.id,client_id:c,custodian:a.custodian,number,nickname:a.nickname}));D.accounts.push(a);render()}
async function delAcct(id){const a=D.accounts.find(x=>x.id===id);const n=D.positions.filter(p=>p.account===id).length,m=D.activity.filter(p=>p.account===id).length;
  if(!confirm(`Delete account ${acctName(a)}?\nThis also removes ${n} position rows and ${m} activity rows.`))return;
  await db('accounts',sb.from('accounts').delete().eq('id',id));D.accounts=D.accounts.filter(x=>x.id!==id);D.positions=D.positions.filter(p=>p.account!==id);D.activity=D.activity.filter(p=>p.account!==id);D.excl=D.excl.filter(e=>e.account!==id);render()}
let mergeTarget='';
async function mergeClient(fromId){const into=mergeTarget;if(!into||into===fromId)return alert('Pick the client to merge into first.');const a=D.clients.find(x=>x.id===fromId),b=D.clients.find(x=>x.id===into);
  if(D.runs.some(r=>r.client===fromId&&r.status!=='draft')||D.invoices.some(i=>i.client===fromId))return alert('This client has finalized runs or invoices; void/delete them first.');
  if(!confirm(`Merge "${a.name}" into "${b.name}"?\nAccounts move over; "${a.name}" is deleted; its fee tiers are dropped in favor of "${b.name}"'s.`))return;
  await db('accounts',sb.from('accounts').update({client_id:into}).eq('client_id',fromId));
  await db('exclusions',sb.from('exclusions').update({client_id:into}).eq('client_id',fromId));
  const drafts=D.runs.filter(r=>r.client===fromId).map(r=>r.id);for(const id of drafts)await db('billing_runs',sb.from('billing_runs').delete().eq('id',id));
  await db('clients',sb.from('clients').delete().eq('id',fromId));
  D.accounts.forEach(x=>{if(x.client===fromId)x.client=into});D.excl.forEach(x=>{if(x.client===fromId)x.client=into});D.tiers=D.tiers.filter(t=>t.client!==fromId);D.runs=D.runs.filter(r=>r.client!==fromId);D.clients=D.clients.filter(x=>x.id!==fromId);mergeTarget='';go('clients',into)}

async function delClient(id){const c=D.clients.find(x=>x.id===id);if(D.runs.some(r=>r.client===id)||D.invoices.some(i=>i.client===id))return alert('This client has billing runs or invoices. Delete the draft runs and void/delete invoices first, or mark the client inactive instead.');

async function addTier(c){const r=document.getElementById('trate').value;if(r===''||Number(r)<=0)return alert('Rate must be greater than 0. To bill a client nothing, mark them inactive.');const mx=document.getElementById('tmax').value;const t={id:uid(),client:c,min:Number(document.getElementById('tmin').value||0),max:mx===''?null:Number(mx),rate:Number(r)/100};await db('fee_tiers',sb.from('fee_tiers').insert({id:t.id,client_id:c,tier_min:t.min,tier_max:t.max,annual_rate:t.rate}));D.tiers.push(t);render()}

async function addExcl(c){const typed=document.getElementById('es').value.split(/[\s,;]+/).map(normSec).filter(Boolean);
  const ticked=[...document.querySelectorAll('.exchk:checked')].map(x=>normSec(x.value));

  if(!rows.length)return alert('Those securities are already excluded.');await db('exclusions',sb.from('exclusions').insert(rows.map(x=>({id:x.id,client_id:c,account_id:account,sec_id:x.secId,note}))));D.excl.push(...rows);render()}

// ---------- client bulk import ----------
let cpending=null;
const CFIELDS=[['client','Client name'],['custodian','Custodian (optional)'],['account','Account number'],['nickname','Account nickname (optional)'],['rate','Flat annual rate % (optional)']];
function cguess(h){h=h.toLowerCase();if(/client|household|family|entity/.test(h))return'client';if(/custodian/.test(h))return'custodian';if(/nick|label|account\s*name|acct\s*name/.test(h))return'nickname';if(/acc(oun)?t/.test(h))return'account';if(/rate|fee|%/.test(h))return'rate';return''}
function readClientSheet(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=e=>{let rows;try{const wb=XLSX.read(e.target.result,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}catch(err){return alert('Could not read file: '+err.message)}
    rows=rows.filter(r=>r.some(c=>String(c).trim()!==''));if(rows.length<2)return alert('No data rows found.');
    let hi=rows.findIndex(r=>r.filter(c=>String(c).trim()!=='').length>=2);if(hi<0)hi=0;const headers=rows[hi].map((h,i)=>String(h).trim()||`Column ${i+1}`);
    const data=rows.slice(hi+1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]])));
    const map={client:'',custodian:'',account:'',nickname:'',rate:''};headers.forEach(h=>{const g=cguess(h);if(g&&!map[g])map[g]=h});
    cpending={name:f.name,headers,rows:data,map,group:false};render()};
  r.readAsArrayBuffer(f);inp.value=''}
function parseClients(){const m=cpending.map;const clients={},accounts=[],skipped=[];
  for(const r of cpending.rows){const name=String(r[m.client]??'').trim();const num=String(r[m.account]??'').trim();if(!name&&!num)continue;
    if(!name){skipped.push('account '+num+' has no client name');continue}
    const key=cpending.group?name.toLowerCase():(name.toLowerCase()+'|'+num);const existing=cpending.group?D.clients.find(c=>c.name.toLowerCase()===key):null;
    if(!clients[key])clients[key]={name,id:existing?existing.id:uid(),isNew:!existing,rate:m.rate&&r[m.rate]!==''?toNum(String(r[m.rate]).replace('%',''))/100:null};
    if(num){if(D.accounts.some(a=>normNum(a.number)===normNum(num))||accounts.some(a=>normNum(a.number)===normNum(num))){skipped.push('account '+num+' already exists');continue}
      const cust=m.custodian?String(r[m.custodian]??'').trim():'';accounts.push({id:uid(),client:clients[key].id,custodian:['Schwab','Pershing','IBKR'].find(x=>x.toLowerCase()===cust.toLowerCase())||(cust?'Other':'Other'),number:num,nickname:m.nickname?String(r[m.nickname]??'').trim():'',active:true})}}
  return{clients:Object.values(clients),accounts,skipped}}
function clientImportPanel(){const m=cpending.map;
  const mapping=`<div class="panel"><b>${esc(cpending.name)}</b> — ${cpending.rows.length} rows. Match the columns:<div class="f" style="margin-top:8px"><label style="display:flex;gap:6px;align-items:center;font-size:14px;color:var(--text)"><input type="checkbox" style="width:auto" ${cpending.group?'checked':''} onchange="cpending.group=this.checked;render()"> Group rows with the same client name into one client (off = one client per row)</label></div><div class="row" style="margin-top:10px">${CFIELDS.map(([k,l])=>`<div class="f"><label>${l}</label><select onchange="cpending.map.${k}=this.value;render()"><option value="">—</option>${cpending.headers.map(h=>`<option ${m[k]===h?'selected':''}>${esc(h)}</option>`).join('')}</select></div>`).join('')}</div>`;
  if(!m.client)return mapping+`<div class="note">Pick the client name column.</div><button class="btn g" onclick="cpending=null;render()">Cancel</button></div>`;
  const{clients,accounts,skipped}=parseClients();const nw=clients.filter(c=>c.isNew);
  return mapping+`${skipped.length?`<div class="err">${skipped.length} row${skipped.length===1?'':'s'} skipped: ${skipped.slice(0,6).map(esc).join('; ')}${skipped.length>6?'…':''}</div>`:''}
  <div class="ok">${nw.length} new client${nw.length===1?'':'s'}${clients.length-nw.length?` (${clients.length-nw.length} already exist, accounts will be added to them)`:''}, ${accounts.length} account${accounts.length===1?'':'s'}${m.rate?`, flat fee tiers for ${nw.filter(c=>c.rate).length}`:''}.</div>
  <div class="wrap"><table><thead><tr><th>Client</th><th>Accounts</th>${m.rate?'<th class="n">Rate</th>':''}</tr></thead><tbody>${clients.map(c=>`<tr><td>${esc(c.name)}${c.isNew?'':' <span class="pill">existing</span>'}</td><td>${accounts.filter(a=>a.client===c.id).map(a=>esc(a.custodian+' '+a.number+(a.nickname?' ('+a.nickname+')':''))).join('<br>')||'<span class="muted">—</span>'}</td>${m.rate?`<td class="n">${c.rate!=null?pct(c.rate):''}</td>`:''}</tr>`).join('')}</tbody></table></div>
  <div class="acts"><button class="btn" onclick="commitClients()" ${clients.length?'':'disabled'}>Import</button><button class="btn g" onclick="cpending=null;render()">Cancel</button></div></div>`}
async function commitClients(){const{clients,accounts}=parseClients();const nw=clients.filter(c=>c.isNew);
  if(nw.length)await db('clients',sb.from('clients').insert(nw.map(c=>({id:c.id,name:c.name}))));
  if(accounts.length)await db('accounts',sb.from('accounts').insert(accounts.map(a=>({id:a.id,client_id:a.client,custodian:a.custodian,number:a.number,nickname:a.nickname}))));
  const tiers=nw.filter(c=>c.rate!=null&&!isNaN(c.rate)&&c.rate>0).map(c=>({id:uid(),client:c.id,min:0,max:null,rate:c.rate}));
  if(tiers.length)await db('fee_tiers',sb.from('fee_tiers').insert(tiers.map(t=>({id:t.id,client_id:t.client,tier_min:0,tier_max:null,annual_rate:t.rate}))));
  nw.forEach(c=>D.clients.push({id:c.id,name:c.name,active:true,notes:''}));D.accounts.push(...accounts);D.tiers.push(...tiers);cpending=null;render()}

function cName(id){return D.clients.find(c=>c.id===id)?.name||'?'}
function readSheet(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=e=>{let rows;try{const wb=XLSX.read(e.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''})}catch(err){return alert('Could not read file: '+err.message)}
    rows=rows.filter(r=>r.some(c=>String(c).trim()!==''));if(rows.length<2)return alert('No data rows found.');
    let hi=rows.findIndex(r=>r.filter(c=>String(c).trim()!=='').length>=3);if(hi<0)hi=0;const headers=rows[hi].map((h,i)=>String(h).trim()||`Column ${i+1}`);
    const data=rows.slice(hi+1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]])));
    const map={account:'',secId:'',cusip:'',desc:'',value:''};
    if(D.mapping&&Object.values(D.mapping).every(v=>!v||headers.includes(v)))Object.assign(map,D.mapping);
    else headers.forEach(h=>{const g=guess(h);if(g&&!map[g])map[g]=h});

  r.readAsArrayBuffer(f);inp.value=''}
function toNum(v){if(typeof v==='number')return v;const s=String(v).replace(/[$,\s]/g,'').replace(/^\((.*)\)$/,'-$1');if(s==='')return null;const n=Number(s);return isNaN(n)?null:n}
function parsePending(){const m=pending.map;const out=[],unmatched=new Set(),bad=[];
  for(const r of pending.rows){const num=normNum(r[m.account]);const sec=m.secId?normSec(r[m.secId]):'';const cusip=m.cusip?normSec(r[m.cusip]):'';const val=toNum(r[m.value]);
    if(!num&&!sec)continue;
    if(val===null){bad.push(`${num} ${sec}: value "${r[m.value]}"`);continue}
    const a=D.accounts.find(x=>normNum(x.number)===num);
    if(!a){unmatched.add(String(r[m.account]));continue}
    out.push({account:a.id,date:monthEnd(pdate),secId:sec||cusip||'CASH',cusip,desc:m.desc?String(r[m.desc]??'').trim():'',value:val})}
  return{out,unmatched:[...unmatched],bad}}
function preview(){const m=pending.map;if(!m.account||!(m.secId||m.cusip)||!m.value)return`<div class="note">Pick the account, a security column (ticker or CUSIP) and market value.</div>`;
  const{out,unmatched,bad}=parsePending();const total=out.reduce((s,p)=>s+p.value,0);

  ${bad.length?`<div class="err">${bad.length} row${bad.length===1?'':'s'} with unreadable values skipped: ${bad.slice(0,5).map(esc).join('; ')}${bad.length>5?'…':''}</div>`:''}
  ${(()=>{const ids=new Set(out.map(p=>p.account));const n=D.positions.filter(p=>p.date===monthEnd(pdate)&&ids.has(p.account)).length;return n?`<div class="note">${n} existing position rows for these ${ids.size} account${ids.size===1?'':'s'} will be replaced. Other accounts' positions for this month are kept.</div>`:''})()}<div class="ok">${out.length} positions ready for ${[...new Set(out.map(p=>p.account))].length} account(s), total ${money(total)}, as of ${fd(monthEnd(pdate))}.</div>

async function delMonth(me){if(!confirm('Delete every position dated '+fd(me)+'?'))return;await db('positions',sb.from('positions').delete().eq('as_of',me));D.positions=D.positions.filter(p=>p.date!==me);render()}
async function commitPending(){const{out}=parsePending();const me=monthEnd(pdate);const ids=[...new Set(out.map(p=>p.account))];for(let i=0;i<ids.length;i+=200)await db('positions',sb.from('positions').delete().eq('as_of',me).in('account_id',ids.slice(i,i+200)));for(let i=0;i<out.length;i+=500)await db('positions',sb.from('positions').insert(out.slice(i,i+500).map(p=>({account_id:p.account,as_of:p.date,sec_id:p.secId,cusip:p.cusip||'',descr:p.desc,value:p.value}))));D.positions=D.positions.filter(p=>!(p.date===me&&ids.includes(p.account))).concat(out);D.mapping={...pending.map};await setSetting('mapping',D.mapping);pending=null;render()}

async function createRuns(recreate){
  const month=document.getElementById('rm').value,cid=runClient||'ALL';if(!month)return;
  if(recreate){if(!confirm('Delete existing drafts for '+fm(month)+' and recreate them?'))return;await deleteDrafts(true)}

    const tiers=tiersFor(c.id);

    const pos=D.positions.filter(p=>p.date===me&&accts.some(a=>a.id===p.account));

      if(a.bill===false){lines.push({acctId:a.id,label:acctName(a),mv,excl:0,billable:0,noBill:true,debitFrom:acctName(a)});continue}

    const debits=[];lines.filter(l=>l.fee).forEach(l=>{const d=debits.find(x=>x.account===l.debitFrom);if(d)d.amount=Math.round((d.amount+l.fee)*100)/100;else debits.push({account:l.debitFrom,amount:l.fee})});
    const run={id:uid(),client:c.id,clientName:c.name,month,vd:me,days,gross,exclT,billable,annual,fee,rate:billable>0?annual/billable:0,lines,exclList,tiers:tb,debits,status:'draft',created:new Date().toISOString()};
    try{await db('billing_runs',sb.from('billing_runs').insert({id:run.id,client_id:c.id,client_name:c.name,month,as_of:me,days,gross,excluded:exclT,billable,annual_fee:annual,fee,eff_rate:run.rate,lines,excl_list:exclList,tiers:tb,debits}));D.runs.push(run);ok.push(c.name)}catch(e){bad.push(c.name+': '+e.message)}}
  render();
  document.getElementById('rmsg').innerHTML=(ok.length?`<div class="ok" style="margin-top:10px">Created ${ok.length} draft run${ok.length===1?'':'s'}.</div>`:'')+bad.map(b=>`<div class="err">${esc(b)}</div>`).join('');
  if(targets.length===1&&ok.length===1)go('runs',D.runs.at(-1).id)}

async function finalizeRun(id){const r=D.runs.find(x=>x.id===id);const c=D.clients.find(x=>x.id===r.client);

function aguess(h){h=h.toLowerCase();if(/trade\s*date|^date|transaction\s*date|activity\s*date|posted/.test(h))return'date';if(/acc(oun)?t\s*(number|no|#|id)?$/.test(h)&&!/name|type/.test(h))return'account';if(/cusip/.test(h))return'cusip';if(/symbol|ticker|security\s*id|sec\s*id/.test(h))return'secId';if(/^(action|activity|transaction|trans)\b|(activity|transaction|action|trans)\s*(type|code)|^type$/.test(h)&&!/account/.test(h))return'type';if(/security\s*desc|description|memo|^security$/.test(h)&&!/account/.test(h))return'desc';if(/net\s*amount|gross\s*amount|^amount|total\s*amount|net\s*cash/.test(h))return'amount';if(/qty|quantity|shares|units/.test(h))return'qty';return''}
function toDate(v){if(v instanceof Date)return isNaN(v)?null:v.toISOString().slice(0,10);if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);if(d)return`${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}const s=String(v).trim();let m;if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){const y=m[3].length===2?'20'+m[3]:m[3];return`${y}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`}const d=new Date(s);return isNaN(d)?null:d.toISOString().slice(0,10)}

    rows=rows.filter(r=>r.some(c=>String(c).trim()!==''));if(rows.length<2)return alert('No data rows found.');
    let hi=rows.findIndex(r=>r.filter(c=>String(c).trim()!=='').length>=3);if(hi<0)hi=0;const headers=rows[hi].map((h,i)=>String(h).trim()||`Column ${i+1}`);
    const data=rows.slice(hi+1).map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]])));

    if(D.actMapping&&Object.values(D.actMapping).every(v=>!v||headers.includes(v)))Object.assign(map,D.actMapping);else headers.forEach(h=>{const g=aguess(h);if(g&&!map[g])map[g]=h});

  ${names.length&&(T.cash||T.mm)?`<div class="wrap"><table><thead><tr><th>Client</th><th class="n">Cash</th><th class="n">Money market</th><th class="n">Total</th></tr></thead><tbody>
  ${names.filter(n=>per[n].cash||per[n].mm).map(n=>{const o=per[n];const accts=Object.keys(o.accts).filter(k=>o.accts[k].cash||o.accts[k].mm);return`<tr><td><b>${esc(n)}</b></td><td class="n">${money(o.cash)}</td><td class="n">${money(o.mm)}</td><td class="n"><b>${money(o.cash+o.mm)}</b></td></tr>`+(accts.length>1?accts.map(k=>`<tr><td class="muted" style="padding-left:22px">${esc(k)}</td><td class="n muted">${money(o.accts[k].cash)}</td><td class="n muted">${money(o.accts[k].mm)}</td><td class="n muted">${money(o.accts[k].cash+o.accts[k].mm)}</td></tr>`).join(''):'')}).join('')}
  </tbody><tfoot><tr><td>All clients</td><td class="n">${money(T.cash)}</td><td class="n">${money(T.mm)}</td><td class="n">${money(T.cash+T.mm)}</td></tr></tfoot></table></div>`:`<div class="note">No cash or money-market symbols found for ${fd(date)}. Tick the symbols below so they're counted.</div>`}
  <h3>Which symbols count as cash</h3><p class="muted">Tick the money-market funds and any cash/sweep symbols in your upload. Rows with an empty security ID are already treated as CASH.</p>
  <div class="panel"><div class="row">
    <div><label>Money market funds</label><div style="display:grid;gap:4px">${held.filter(k=>!isCash(k)).map(k=>chk('mmSyms',k)).join('')||'<span class="muted">—</span>'}</div></div>
    <div><label>Cash / sweep</label><div style="display:grid;gap:4px">${held.filter(k=>!isMM(k)).map(k=>chk('cashSyms',k)).join('')||'<span class="muted">—</span>'}</div></div></div>
  <div class="f" style="margin-top:12px"><label>Add symbols not in this month's upload (comma or space separated)</label><div class="row"><input id="mmadd" placeholder="Money market, e.g. SWVXX FDRXX" style="text-transform:uppercase"><input id="cashadd" placeholder="Cash, e.g. CASH USD" style="text-transform:uppercase"></div></div>
  <button class="btn" onclick="addSyms()">Save symbols</button>
  <p class="muted" style="margin-top:10px">Currently — money market: ${D.mmSyms.map(esc).join(', ')||'none'} · cash: ${D.cashSyms.map(esc).join(', ')||'none'}</p></div>`;
}
async function toggleSym(list,sym,on){sym=normSec(sym);const other=list==='mmSyms'?'cashSyms':'mmSyms';D[other]=D[other].filter(x=>normSec(x)!==sym);D[list]=D[list].filter(x=>normSec(x)!==sym);if(on)D[list].push(sym);await setSetting('cashSyms',D.cashSyms);await setSetting('mmSyms',D.mmSyms);render()}
async function addSyms(){const sp=id=>document.getElementById(id).value.split(/[\s,;]+/).map(normSec).filter(Boolean);for(const x of sp('mmadd'))await toggleSym('mmSyms',x,true);for(const x of sp('cashadd'))await toggleSym('cashSyms',x,true);render()}

// ---------- invoices ----------
let invQ='';
function loadInvoices(){}
async function invUrl(i){const{data,error}=await sb.storage.from('invoices').createSignedUrl(i.path,120);if(error)throw new Error(error.message);return data.signedUrl}
async function openInvoice(id){const i=D.invoices.find(x=>x.id===id);if(!i)return;const w=window.open('','_blank');w.location=await invUrl(i)}
async function dlInvoice(id){const i=D.invoices.find(x=>x.id===id);if(!i)return;const{data,error}=await sb.storage.from('invoices').download(i.path);if(error)return alert(error.message);const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=i.no+'.pdf';a.click()}
async function delInvoice(id){const i=D.invoices.find(x=>x.id===id);if(!confirm('Delete invoice '+i.no+'? The billing run stays; you can void it separately.'))return;
  await sb.storage.from('invoices').remove([i.path]);await db('invoices',sb.from('invoices').delete().eq('id',id));D.invoices=D.invoices.filter(x=>x.id!==id);render()}
function invoices(){
  const q=invQ.toLowerCase();
  const invCache=D.invoices.slice().sort((a,b)=>b.created.localeCompare(a.created));const rows=invCache.filter(i=>!q||[i.no,i.clientName,fm(i.month),money(i.fee)].join(' ').toLowerCase().includes(q));
  const F=D.firm;
  return `<h2>Invoices</h2><p class="muted">Created automatically when a billing run is finalized. Stored in Supabase.</p>
  <div class="panel"><input placeholder="Search by invoice no., client, month or amount" value="${esc(invQ)}" oninput="invQ=this.value;document.getElementById('app').innerHTML=invoices();document.querySelector('main input').focus();document.querySelector('main input').setSelectionRange(99,99)"></div>
  ${rows.length?`<table><thead><tr><th>Invoice</th><th>Client</th><th>Month</th><th class="n">Fee</th><th></th></tr></thead><tbody>${rows.map(i=>`<tr><td><b>${esc(i.no)}</b><div class="muted">${new Date(i.created).toLocaleDateString()}</div></td><td>${esc(i.clientName)}</td><td>${fm(i.month)}</td><td class="n">${money(i.fee)}</td><td class="n"><button class="btn g s" onclick="openInvoice('${i.id}')">Open</button> <button class="btn g s" onclick="dlInvoice('${i.id}')">Save</button> <button class="btn d s" onclick="delInvoice('${i.id}')">Delete</button></td></tr>`).join('')}</tbody></table>`:`<div class="empty">${invCache.length?'No invoices match.':'No invoices yet. Finalize a billing run to create one.'}</div>`}
  <h3>Invoice header</h3><div class="panel"><div class="f"><label>Firm name</label><input value="${esc(F.name)}" onchange="D.firm.name=this.value;setSetting('firm',D.firm)"></div>
  <div class="f"><label>Address</label><input value="${esc(F.addr)}" onchange="D.firm.addr=this.value;setSetting('firm',D.firm)" placeholder="Street, City, ST ZIP"></div>
  <div class="row"><div class="f"><label>Phone</label><input value="${esc(F.phone)}" onchange="D.firm.phone=this.value;setSetting('firm',D.firm)"></div><div class="f"><label>Email</label><input value="${esc(F.email)}" onchange="D.firm.email=this.value;setSetting('firm',D.firm)"></div></div>
  <div class="f"><label>Payment terms (printed on invoice)</label><input value="${esc(F.terms)}" onchange="D.firm.terms=this.value;setSetting('firm',D.firm)"></div>
  <div class="f"><label>Next invoice number</label><input class="n" type="number" value="${D.nextInv}" onchange="D.nextInv=Number(this.value)||1;setSetting('nextInv',D.nextInv)"></div></div>`;
}
const LOGO='data:image/jpeg;base64,'+LOGO_B64;
function makeInvoicePdf(runs,no,opt){
  if(!Array.isArray(runs))runs=[runs];opt=opt||{};const r0=runs[0];const F=D.firm;
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'pt',format:'letter'});const W=612,L=54,R=558;let y=0;
  const brown=[74,61,46],tan=[196,184,144],cream=[249,247,240],grey=[120,113,100],line=[221,216,204],ink=[40,34,28];
  const txt=(s,x,yy,o={})=>{doc.setFont('helvetica',o.b?'bold':'normal');doc.setFontSize(o.s||9.5);doc.setTextColor(...(o.c||ink));doc.text(String(s),x,yy,{align:o.a||'left'})};
  const fit=(str,maxW)=>{doc.setFont('helvetica','normal');doc.setFontSize(9);str=String(str);if(doc.getTextWidth(str)<=maxW)return str;while(str.length>3&&doc.getTextWidth(str+'…')>maxW)str=str.slice(0,-1);return str+'…'};
  const rule=(yy,c=line,w=0.6)=>{doc.setDrawColor(...c);doc.setLineWidth(w);doc.line(L,yy,R,yy)};
  const page=()=>{doc.addPage();y=60};const need=h=>{if(y+h>730)page()};
  // header
  doc.addImage(LOGO,'JPEG',L,40,150,77);
  txt(F.name,R,52,{s:10,b:1,c:brown,a:'right'});[F.addr,F.phone,F.email].filter(Boolean).forEach((t,i)=>txt(t,R,66+i*12,{s:8.5,c:grey,a:'right'}));
  y=132;doc.setDrawColor(...tan);doc.setLineWidth(1.4);doc.line(L,y,R,y);y+=26;
  txt('Advisory Fee Invoice',L,y,{s:17,b:1,c:brown});y+=24;
  const meta=[['Invoice number',no],['Invoice date',new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})],['Billing period',fm(r0.month)+' ('+r0.days+' days)'],['Values as of',fd(r0.vd)]];
  meta.forEach((m,i)=>{const x=L+i*126;txt(m[0],x,y,{s:7.5,c:grey});txt(m[1],x,y+13,{s:9.5,b:1})});y+=36;
  txt('Billed to',L,y,{s:7.5,c:grey});txt(opt.billToName||r0.clientName,L,y+14,{s:12,b:1,c:brown});
  if(runs.length>1)txt(runs.map(g=>g.clientName).join('  ·  '),L,y+28,{s:8.5,c:grey});y+=runs.length>1?48:36;
  // total box
  const total=runs.reduce((s,g)=>s+g.fee,0),bill=runs.reduce((s,g)=>s+g.billable,0);
  doc.setFillColor(...cream);doc.rect(L,y,R-L,60,'F');doc.setFillColor(...tan);doc.rect(L,y,4,60,'F');
  txt('Total advisory fee for '+fm(r0.month),L+18,y+20,{s:8.5,c:grey});txt(money(total),L+18,y+46,{s:22,b:1,c:brown});
  txt(money(bill)+' billable value',R-14,y+24,{s:9,c:grey,a:'right'});txt('fee prorated for '+r0.days+' of 365 days',R-14,y+38,{s:8.5,c:grey,a:'right'});y+=84;
  const table=(head,cols,rows,foot)=>{need(60);if(head){txt(head,L,y,{s:10.5,b:1,c:brown});y+=8;rule(y,brown,0.8);y+=14}
    cols.forEach(c=>txt(c.h,c.x,y,{s:7.5,c:grey,a:c.a}));y+=5;rule(y);y+=13;
    rows.forEach(rw=>{need(16);cols.forEach((c,i)=>txt(rw[i],c.x,y,{s:9,a:c.a,b:c.b,c:c.muted&&i===0?grey:ink}));y+=14});
    if(foot){rule(y-8,brown,0.8);cols.forEach((c,i)=>txt(foot[i],c.x,y+5,{s:9,b:1,a:c.a}));y+=18}y+=18};
  // one table: every account, grouped by client when it's a household
  const cols=[{h:'Account',x:L},{h:'Market value',x:300,a:'right'},{h:'Billable value',x:395,a:'right'},{h:'Rate',x:450,a:'right'},{h:'Fee',x:R,a:'right'}];
  const rows=[];
  for(const r of runs){const tu=r.tiers.filter(t=>t.slice>0);const rateTxt=tu.length===1?pct(tu[0].rate,2):pct(r.rate,3);
    if(runs.length>1)rows.push([r.clientName,'','','','',true]);
    const accts=D.accounts.filter(a=>a.client===r.client);
    r.lines.filter(l=>l.mv>0||l.billable>0).forEach(l=>{const a=l.acctId?accts.find(x=>x.id===l.acctId):null;const num=a?a.number:'';const label=a?(num+(a.nickname?'  '+a.nickname:''))+'':l.label;
      rows.push([fit(label,175),money(l.mv),money(l.billable),l.noBill?'0.00%':rateTxt,money(l.fee||0)])})}
  need(60);txt('Fee calculation',L,y,{s:10.5,b:1,c:brown});y+=8;rule(y,brown,0.8);y+=14;
  cols.forEach(c=>txt(c.h,c.x,y,{s:7.5,c:grey,a:c.a}));y+=5;rule(y);y+=13;
  rows.forEach(rw=>{need(16);if(rw[5]){y+=4;txt(rw[0],L,y,{s:9,b:1,c:brown});y+=15;return}cols.forEach((c,i)=>txt(rw[i],c.x,y,{s:9,a:c.a}));y+=14});
  rule(y-8,brown,0.8);txt('Total for '+fm(r0.month)+' ('+r0.days+' days)',L,y+5,{s:9,b:1});txt(money(runs.reduce((s,g)=>s+g.gross,0)),300,y+5,{s:9,b:1,a:'right'});txt(money(bill),395,y+5,{s:9,b:1,a:'right'});txt(money(total),R,y+5,{s:9,b:1,a:'right'});y+=24;
  const excl=runs.flatMap(r=>r.exclList);if(excl.length){need(14);txt('Billable value excludes '+excl.length+' position'+(excl.length===1?'':'s')+' ('+money(excl.reduce((s,e)=>s+e.value,0))+'): '+[...new Set(excl.map(e=>e.secId))].slice(0,12).join(', ')+(new Set(excl.map(e=>e.secId)).size>12?', …':'')+'.',L,y,{s:8,c:grey});y+=14}
  const multi=runs.filter(r=>r.tiers.filter(t=>t.slice>0).length>1);if(multi.length){need(14);txt('Tiered rates shown as the effective annual rate. Fee = billable value x rate / 365 x '+r0.days+' days.',L,y,{s:8,c:grey});y+=14}
  y+=10;
  need(40);rule(y,tan,1);y+=16;if(F.terms)txt(F.terms,L,y,{s:8.5,c:grey});
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);txt(no+'  ·  '+(opt.billToName||r0.clientName)+'  ·  page '+i+' of '+n,L,772,{s:7,c:grey});txt('Ref '+r0.id.slice(0,8),R,772,{s:7,c:grey,a:'right'})}
  return doc.output('blob')}

document.getElementById('ver').textContent=APP_VERSION;
boot();
</script>
